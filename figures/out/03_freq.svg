<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="fqt fqd" style="width:100%;height:auto;max-width:720px;display:block;margin:0.8em auto" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="13"><title id="fqt">100万人を検査すると、陽性の半分は健康な人</title><desc id="fqd">有病率1%なので100万人のうち病気は10,000人、健康は990,000人。感度99%なので病気の人からは9,900人が陽性になる。特異度99%でも健康な人は990,000人と多いので、その1%にあたる9,900人が誤って陽性になる。陽性19,800人のうち本当に病気なのは9,900人で、50%にしかならない。</desc><text x="0.0" y="28.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">検査の精度99%と、陽性的中率50%は別の数字</text><rect x="20.0" y="60.0" width="6.8" height="40.0" rx="3" ry="3" fill="#c62828" fill-opacity="0.3" stroke="#c62828" stroke-width="1" stroke-opacity="0.7"/><rect x="26.8" y="60.0" width="673.2" height="40.0" rx="3" ry="3" fill="#00897b" fill-opacity="0.22" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><text x="26.0" y="50.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#c62828" fill-opacity="1.0">病気 10,000人（1%）</text><text x="700.0" y="50.0" font-size="11.5" text-anchor="end" font-weight="bold" fill="#00897b" fill-opacity="1.0">健康 990,000人（99%）</text><text x="360.0" y="85.0" font-size="13" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0">100万人</text><line x1="23.4" y1="104.0" x2="23.4" y2="154.0" stroke="#c62828" stroke-width="1.6" stroke-opacity="0.7"/><polygon points="23.4,154.0 19.7,145.8 27.1,145.8" fill="#c62828" fill-opacity="0.7"/><line x1="363.4" y1="104.0" x2="363.4" y2="154.0" stroke="#00897b" stroke-width="1.6" stroke-opacity="0.7"/><polygon points="363.4,154.0 359.7,145.8 367.1,145.8" fill="#00897b" fill-opacity="0.7"/><text x="31.4" y="122.0" font-size="11" text-anchor="start" fill="#c62828" fill-opacity="1.0">感度99%</text><text x="371.4" y="122.0" font-size="11" text-anchor="start" fill="#00897b" fill-opacity="1.0">健康な人の1%が誤って陽性</text><rect x="20.0" y="160.0" width="300.0" height="52.0" rx="4" ry="4" fill="#c62828" fill-opacity="0.3" stroke="#c62828" stroke-width="1" stroke-opacity="0.7"/><rect x="320.0" y="160.0" width="300.0" height="52.0" rx="4" ry="4" fill="#00897b" fill-opacity="0.22" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><text x="170.0" y="192.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#c62828" fill-opacity="1.0">真陽性 9,900人</text><text x="470.0" y="192.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#00897b" fill-opacity="1.0">偽陽性 9,900人</text><text x="20.0" y="148.0" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">陽性になった 19,800人（ここに拡大して内訳を見る）</text><text x="0.0" y="268.0" font-size="14" text-anchor="start" font-weight="bold" fill="#ef6c00" fill-opacity="1.0">P(病気 | 陽性) ＝ 9,900 ÷ 19,800 ＝ 50%</text><text x="0.0" y="300.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.95">病気の人はもともと少ないので、健康な人のたった1%でも、人数にすると真陽性と同じだけ出てしまう。</text><text x="0.0" y="324.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.95">直感が外すのは P(陽性 | 病気) ＝ 99% と P(病気 | 陽性) ＝ 50% を取り違えるから。縦棒のどちらが条件かで別の量になる。</text><text x="0.0" y="348.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.95">検査の性能が低いのではない。50%は「有病率1%のもとでの答え」である。</text><text x="0.0" y="382.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.7">（感度99%・特異度99%・有病率1%としたときの計算。人数は小数を切り捨てている。）</text></svg>