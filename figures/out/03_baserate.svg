<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" aria-labelledby="brt brd" style="width:100%;height:auto;max-width:720px;display:block;margin:0.8em auto" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="13"><title id="brt">検査の性能は同じでも、珍しい病気ほど陽性的中率は下がる</title><desc id="brd">横軸は有病率（対数目盛り）、縦軸は陽性的中率。感度99%・特異度99%で固定しているのに、有病率0.01%なら1.0%、0.1%なら9.0%、1%なら50.0%、10%なら91.7%、50%なら99.0%と大きく変わる。検査の性能だけを見て判断すると、この基準率を無視することになる。</desc><text x="0.0" y="30.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">検査の性能は何も変えていない。変えたのは病気の珍しさだけ</text><line x1="58.0" y1="258.0" x2="580.0" y2="258.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/><text x="50.0" y="262.0" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">0%</text><line x1="58.0" y1="210.5" x2="580.0" y2="210.5" stroke="currentColor" stroke-width="1" stroke-opacity="0.13"/><text x="50.0" y="214.5" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">25%</text><line x1="58.0" y1="163.0" x2="580.0" y2="163.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.13"/><text x="50.0" y="167.0" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">50%</text><line x1="58.0" y1="115.5" x2="580.0" y2="115.5" stroke="currentColor" stroke-width="1" stroke-opacity="0.13"/><text x="50.0" y="119.5" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">75%</text><line x1="58.0" y1="68.0" x2="580.0" y2="68.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.13"/><text x="50.0" y="72.0" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">100%</text><line x1="94.6" y1="68.0" x2="94.6" y2="258.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.1"/><text x="94.6" y="277.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">0.01%</text><line x1="216.6" y1="68.0" x2="216.6" y2="2