<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-labelledby="dgt dgd" style="width:100%;height:auto;max-width:720px;display:block;margin:0.8em auto" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="13"><title id="dgt">観察研究とRCT ―― ランダム化は矢印を1本切る</title><desc id="dgd">左は観察研究。健康志向が「サプリを飲むかどうか」と「健康」の両方に矢印を出しているので、飲んだ人と飲まない人の差にはサプリの効果と健康志向の差が混ざってしまう。右はRCT。くじ引きが飲むかどうかを決めるので、健康志向からサプリへの矢印が切れる。残った差はサプリの効果だけになる。</desc><text x="0.0" y="28.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">ランダム化が切るのは、この1本だけ</text><text x="10.0" y="60.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">① 観察研究（本人が飲むかどうかを決める）</text><rect x="100.0" y="85.0" width="150.0" height="46.0" rx="6" ry="6" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-width="1" stroke-opacity="0.7"/><text x="175.0" y="104.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ef6c00" fill-opacity="1.0">健康志向</text><text x="175.0" y="122.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.7">（交絡）</text><rect x="15.0" y="193.0" width="124.0" height="46.0" rx="6" ry="6" fill="#5c6bc0" fill-opacity="0.12" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.7"/><text x="77.0" y="216.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#5c6bc0" fill-opacity="1.0">サプリを飲む</text><rect x="211.0" y="193.0" width="124.0" height="46.0" rx="6" ry="6" fill="#00897b" fill-opacity="0.12" stroke="#00897b" stroke-width="1" stroke-opacity="0.7"/><text x="273.0" y="216.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#00897b" fill-opacity="1.0">健康</text><line x1="129.0" y1="126.0" x2="89.0" y2="190.0" stroke="#ef6c00" stroke-width="2" stroke-opacity="0.9"/><polygon points="89.0,190.0 90.2,181.1 96.5,185.0" fill="#ef6c00" fill-opacity="0.9"/><line x1="221.0" y1="126.0" x2="261.0" y2="190.0" stroke="#ef6c00" stroke-width="2" stroke-opacity="0.9"/><polygon points="261.0,190.0 253.5,185.0 259.8,181.1" fill="#ef6c00" fill-opacity="0.9"/><line x1="141.0" y1="216.0" x2="209.0" y2="216.0" stroke="#5c6bc0" stroke-width="2" stroke-opacity="0.9"/><polygon points="209.0,216.0 200.8,219.7 200.8,212.3" fill="#5c6bc0" fill-opacity="0.9"/><text x="175.0" y="206.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">効果 0</text><line x1="360.0" y1="50.0" x2="360.0" y2="330.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.18"/><text x="390.0" y="60.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">② RCT（くじ引きで決める）</text><rect x="480.0" y="85.0" width="150.0" height="46.0" rx="6" ry="6" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-width="1" stroke-opacity="0.7"/><text x="555.0" y="104.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ef6c00" fill-opacity="1.0">健康志向</text><text x="555.0" y="122.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.7">（交絡）</text><rect x="395.0" y="193.0" width="124.0" height="46.0" rx="6" ry="6" fill="#5c6bc0" fill-opacity="0.12" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.7"/><text x="457.0" y="216.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#5c6bc0" fill-opacity="1.0">サプリを飲む</text><rect x="591.0" y="193.0" width="124.0" height="46.0" rx="6" ry="6" fill="#00897b" fill-opacity="0.12" stroke="#00897b" stroke-width="1" stroke-opacity="0.7"/><text x="653.0" y="216.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#00897b" fill-opacity="1.0">健康</text><line x1="509.0" y1="126.0" x2="469.0" y2="190.0" stroke="#ef6c00" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="5 4"/><line x1="475.0" y1="144.0" x2="503.0" y2="174.0" stroke="#c62828" stroke-width="3" stroke-opacity="0.95"/><line x1="503.0" y1="144.0" x2="475.0" y2="174.0" stroke="#c62828" stroke-width="3" stroke-opacity="0.95"/><text x="445.0" y="166.0" font-size="11.5" text-anchor="end" font-weight="bold" fill="#c62828" fill-opacity="1.0">切れる</text><line x1="601.0" y1="126.0" x2="641.0" y2="190.0" stroke="#ef6c00" stroke-width="2" stroke-opacity="0.9"/><polygon points="641.0,190.0 633.5,185.0 639.8,181.1" fill="#ef6c00" fill-opacity="0.9"/><line x1="521.0" y1="216.0" x2="589.0" y2="216.0" stroke="#5c6bc0" stroke-width="2" stroke-opacity="0.9"/><polygon points="589.0,216.0 580.8,219.7 580.8,212.3" fill="#5c6bc0" fill-opacity="0.9"/><text x="555.0" y="206.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">効果 0</text><rect x="395.0" y="280.0" width="124.0" height="40.0" rx="6" ry="6" fill="#c62828" fill-opacity="0.12" stroke="#c62828" stroke-width="1" stroke-opacity="0.7"/><text x="457.0" y="300.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#c62828" fill-opacity="1.0">くじ引き</text><line x1="457.0" y1="280.0" x2="457.0" y2="242.0" stroke="#c62828" stroke-width="2" stroke-opacity="0.9"/><polygon points="457.0,242.0 460.7,250.2 453.3,250.2" fill="#c62828" fill-opacity="0.9"/><text x="16.0" y="272.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.9">飲んだ人の健康 − 飲まない人の健康</text><text x="16.0" y="290.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#c62828" fill-opacity="1.0">＝ サプリの効果 ＋ 健康志向の差</text><text x="16.0" y="310.0" font-size="11" text-anchor="start" fill="#c62828" fill-opacity="0.9">2つを分けられない（交絡）</text><text x="0.0" y="352.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.95">くじ引きは健康志向を見ないので、2つの群の健康志向は平均的にそろう。残った差はサプリの効果だけになる。</text><text x="0.0" y="378.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.7">（第6〜7回は「独立が崩れると推測が壊れる」だった。因果推論は逆に、独立を自分で作り出して使う。）</text></svg>