<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" role="img" aria-labelledby="idt idd" style="width:100%;height:auto;max-width:720px;display:block;margin:0.8em auto" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="13"><title id="idt">独立と排反は、まったく別の概念</title><desc id="idd">左はサイコロで A＝偶数の目、B＝3の目。重なりがないので排反だが、3が出たと分かると偶数の確率は1/2から0に変わるので独立ではない。右はコインを2回投げて A＝2投目が表、B＝1投目が表。重なりはあり、1投目を知っても2投目の確率は1/2のまま変わらないので独立である。排反は「重ならない」、独立は「知っても確率が変わらない」。</desc><text x="0.0" y="28.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">重ならないこと（排反）と、知っても変わらないこと（独立）</text><text x="10.0" y="64.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">サイコロ　A＝偶数の目、B＝3の目</text><rect x="20.0" y="80.0" width="44.0" height="44.0" rx="5" ry="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/><text x="42.0" y="108.0" font-size="15" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0">1</text><rect x="72.0" y="80.0" width="44.0" height="44.0" rx="5" ry="5" fill="#5c6bc0" fill-opacity="0.22" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><text x="94.0" y="108.0" font-size="15" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0">2</text><rect x="124.0" y="80.0" width="44.0" height="44.0" rx="5" ry="5" fill="#c62828" fill-opacity="0.22" stroke="#c62828" stroke-width="1" stroke-opacity="0.6"/><text x="146.0" y="108.0" font-size="15" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0">3</text><rect x="176.0" y="80.0" width="44.0" height="44.0" rx="5" ry="5" fill="#5c6bc0" fill-opacity="0.22" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><text x="198.0" y="108.0" font-size="15" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0">4</text><rect x="228.0" y="80.0" width="44.0" height="44.0" rx="5" ry="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/><text x="250.0" y="108.0" font-size="15" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0">5</text><rect x="280.0" y="80.0" width="44.0" height="44.0" rx="5" ry="5" fill="#5c6bc0" fill-opacity="0.22" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><text x="302.0" y="108.0" font-size="15" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0">6</text><rect x="18.0" y="78.0" width="48.0" height="48.0" fill="none" fill-opacity="1.0" stroke="#5c6bc0" stroke-width="0" stroke-opacity="0"/><text x="10.0" y="150.0" font-size="11.5" text-anchor="start" fill="#5c6bc0" fill-opacity="1.0">A＝偶数（2・4・6）</text><text x="150.0" y="150.0" font-size="11.5" text-anchor="start" fill="#c62828" fill-opacity="1.0">B＝3</text><text x="10.0" y="174.0" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">重なりは無い → 排反</text><text x="10.0" y="196.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.9">だが B（3が出た）と分かると</text><text x="10.0" y="216.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c62828" fill-opacity="1.0">P(A) は 1/2 → 0 に変わる → 独立ではない</text><text x="390.0" y="64.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">コイン2回　A＝2投目が表、B＝1投目が表</text><rect x="396.0" y="80.0" width="140.0" height="44.0" rx="5" ry="5" fill="#ef6c00" fill-opacity="0.22" stroke="#ef6c00" stroke-width="1" stroke-opacity="0.6"/><text x="466.0" y="107.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0">1投目 表　2投目 表</text><rect x="546.0" y="80.0" width="140.0" height="44.0" rx="5" ry="5" fill="#00897b" fill-opacity="0.22" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><text x="616.0" y="107.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0">1投目 表　2投目 裏</text><rect x="396.0" y="132.0" width="140.0" height="44.0" rx="5" ry="5" fill="#5c6bc0" fill-opacity="0.22" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><text x="466.0" y="159.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0">1投目 裏　2投目 表</text><rect x="546.0" y="132.0" width="140.0" height="44.0" rx="5" ry="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/><text x="616.0" y="159.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0">1投目 裏　2投目 裏</text><text x="390.0" y="174.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.75">橙＝A と B の両方／青＝A のみ／緑＝B のみ</text><text x="390.0" y="196.0" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">重なりがある（表・表）→ 排反ではない</text><text x="390.0" y="218.0" font-size="12" text-anchor="start" font-weight="bold" fill="#00897b" fill-opacity="1.0">1投目を知っても 2投目は 1/2 のまま → 独立</text><line x1="360.0" y1="56.0" x2="360.0" y2="232.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/><text x="0.0" y="268.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.95">排反な2つは、片方が起きたらもう片方は起きないと分かる。つまり「知ると確率が変わる」ので、確率が0でないかぎり独立にはならない。</text><text x="0.0" y="292.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.95">この2つを同じ言葉で呼ばないこと。第2回の課題でも、ここは分けて書いてほしい。</text><text x="0.0" y="326.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.7">（サイコロは6面が等確率、コインは表裏が半々で独立、という仮定のもとでの値。）</text></svg>