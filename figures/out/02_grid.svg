" fill="currentColor" fill-opacity="0.07"/><text x="24.0" y="60.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">① 100人ぜんたい</text><text x="404.0" y="60.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#00897b" fill-opacity="1.0">② 一人暮らしの20人だけに絞る</text><text x="24.0" y="340.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#5c6bc0" fill-opacity="1.0">アルバイト 30人 ÷ 100人 ＝ 0.30</text><text x="24.0" y="360.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.8">これが P(A)</text><text x="404.0" y="340.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#ef6c00" fill-opacity="1.0">アルバイト 12人 ÷ 20人 ＝ 0.60</text><text x="404.0" y="360.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.8">これが P(A | B)</text><circle cx="28.0" cy="306.0" r="6.5" fill="#ef6c00" fill-opacity="0.85"/><text x="42.0" y="310.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="1.0">両方 12人</text><circle cx="140.0" cy="306.0" r="6.5" fill="#5c6bc0" fill-opacity="0.6"/><text x="154.0" y="310.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="1.0">アルバイトのみ 18人</text><circle cx="300.0" cy="306.0" r="6.5" fill="#00897b" fill-opacity="0.6"/><text x="314.0" y="310.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="1.0">一人暮らしのみ 8人</text><text x="0.0" y="388.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.95">P(A)=0.30 なのに P(A|B)=0.60。知ると確率が変わるので、この100人の中で A と B は独立ではない（0.30×0.20＝0.06 ≠ 0.12）。</text></svg>