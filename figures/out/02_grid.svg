<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" aria-labelledby="gdt gdd" style="width:100%;height:auto;max-width:720px;display:block;margin:0.8em auto" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="13"><title id="gdt">100人の格子で見る条件付き確率</title><desc id="gdd">学生100人のうちアルバイトをしているのが30人、一人暮らしが20人、その両方が12人。左は100人ぜんたいで、アルバイトの割合は30/100 = 0.30。右は「一人暮らし」の20人だけに舞台を絞ったもので、その中でアルバイトは12人、割合は12/20 = 0.60 に変わる。分母も分子も切り替わっている。</desc><text x="0.0" y="28.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">条件がつくと、分母も分子も切り替わる</text><circle cx="40.0" cy="76.0" r="6.5" fill="#ef6c00" fill-opacity="0.85"/><circle cx="62.0" cy="76.0" r="6.5" fill="#ef6c00" fill-opacity="0.85"/><circle cx="84.0" cy="76.0" r="6.5" fill="#ef6c00" fill-opacity="0.85"/><circle cx="106.0" cy="76.0" r="6.5" fill="#ef6c00" fill-opacity="0.85"/><circle cx="128.0" cy="76.0" r="6.5" fill="#ef6c00" fill-opacity="0.85"/><circle cx="150.0" cy="76.0" r="6.5" fill="#ef6c00" fill-opacity="0.85"/><circle cx="172.0" cy="76.0" r="6.5" fill="#ef6c00" fill-opacity="0.85"/><circle cx="194.0" cy="76.0" r="6.5" fill="#ef6c00" fill-opacity="0.85"/><circle cx="216.0" cy="76.0" r="6.5" fill="#ef6c00" fill-opacity="0.85"/><circle cx="238.0" cy="76.0" r="6.5" fill="#ef6c00" fill-opacity="0.85"/><circle cx="40.0" cy="98.0" r="6.5" fill="#ef6c00" fill-opacity="0.85"/><circle cx="62.0" cy="98.0" r="6.5" fill="#ef6c00" fill-opacity="0.85"/><circle cx="84.0" cy="98.0" r="6.5" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="106.0" cy="98.0" r="6.5" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="128.0" cy="98.0" r="6.5" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="150.0" cy="98.0" r="6.5" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="172.0" cy="98.0" r="6.5" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="194.0" cy="98.0" r="6.5" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="216.0" cy="98.0" r="6.5" fill="#5c6bc0" fill-opac