<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" role="img" aria-labelledby="spt spd" style="width:100%;height:auto;max-width:720px;display:block;margin:0.8em auto" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="13"><title id="spt">シンプソンのパラドックス ―― 棒の幅が人数</title><desc id="spd">棒の高さが合格率、幅が人数である。文系でも理系でもアプリBのほうが合格率は高い。ところがアプリAは合格しやすい文系の受験者が200人と多く、アプリBは合格しにくい理系が200人と多い。そのため合算するとAが58.6%、Bが46.4%となり、順位が逆転する。正しいのは学部で分けて見た結論、すなわちBのほうが上である。</desc><text x="0.0" y="28.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">どちらの学部でもBが上。なのに合算するとAが上になる</text><line x1="30.0" y1="250.0" x2="690.0" y2="250.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/><text x="24.0" y="254.0" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">0%</text><line x1="30.0" y1="205.5" x2="690.0" y2="205.5" stroke="currentColor" stroke-width="1" stroke-opacity="0.12"/><text x="24.0" y="209.5" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">25%</text><line x1="30.0" y1="161.0" x2="690.0" y2="161.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.12"/><text x="24.0" y="165.0" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">50%</text><line x1="30.0" y1="116.5" x2="690.0" y2="116.5" stroke="currentColor" stroke-width="1" stroke-opacity="0.12"/><text x="24.0" y="120.5" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">75%</text><text x="117.8" y="54.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#5c6bc0" fill-opacity="1.0">アプリA</text><rect x="54.0" y="125.4" width="84.0" height="124.6" rx="3" ry="3" fill="#5c6bc0" fill-opacity="0.3" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.7"/><text x="96.0" y="117.4" font-size="12" text-anchor="middle" font-weight="bold" fill="#5c6bc0" fill-opacity="1.0">70%</text><text x="96.0" y="268.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.85">文系</text><text x="96.0" y="283.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.6">200人</text><rect x="148.0" y="196.6" width="33.6" height="53.4" rx="3" ry="3" fill="#5c6bc0" fill-opacity="0.3" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.7"/><text x="164.8" y="188.6" font-size="12" text-anchor="middle" font-weight="bold" fill="#5c6bc0" fill-opacity="1.0">30%</text><text x="164.8" y="268.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.85">理系</text><text x="164.8" y="283.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.6">80人</text><text x="299.4" y="54.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#ef6c00" fill-opacity="1.0">アプリB</text><rect x="235.6" y="116.5" width="33.6" height="133.5" rx="3" ry="3" fill="#ef6c00" fill-opacity="0.3" stroke="#ef6c00" stroke-width="1" stroke-opacity="0.7"/><text x="252.4" y="108.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#ef6c00" fill-opacity="1.0">75%</text><text x="252.4" y="268.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.85">文系</text><text x="252.4" y="283.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.6">80人</text><rect x="279.2" y="187.7" width="84.0" height="62.3" rx="3" ry="3" fill="#ef6c00" fill-opacity="0.3" stroke="#ef6c00" stroke-width="1" stroke-opacity="0.7"/><text x="321.2" y="179.7" font-size="12" text-anchor="middle" font-weight="bold" fill="#ef6c00" fill-opacity="1.0">35%</text><text x="321.2" y="268.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.85">理系</text><text x="321.2" y="283.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.6">200人</text><rect x="427.2" y="145.7" width="117.6" height="104.3" rx="3" ry="3" fill="#5c6bc0" fill-opacity="0.18" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.7"/><text x="486.0" y="137.7" font-size="12" text-anchor="middle" font-weight="bold" fill="#5c6bc0" fill-opacity="1.0">58.6%</text><text x="486.0" y="268.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.85">合算A</text><text x="486.0" y="283.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.6">280人</text><rect x="554.8" y="167.4" width="117.6" height="82.6" rx="3" ry="3" fill="#ef6c00" fill-opacity="0.18" stroke="#ef6c00" stroke-width="1" stroke-opacity="0.7"/><text x="613.6" y="159.4" font-size="12" text-anchor="middle" font-weight="bold" fill="#ef6c00" fill-opacity="1.0">46.4%</text><text x="613.6" y="268.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.85">合算B</text><text x="613.6" y="283.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.6">280人</text><text x="0.0" y="300.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.95">幅が人数。アプリAには合格しやすい文系が200人、アプリBには合格しにくい理系が200人いる。</text><text x="0.0" y="324.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.95">この構成比の偏り（＝学部という交絡）が、合算したときに本当の優劣を覆い隠してしまう。</text><text x="0.0" y="348.0" font-size="12" text-anchor="start" font-weight="bold" fill="#ef6c00" fill-opacity="1.0">正しいのは学部で分けて見た結論 ―― Bのほうが上である。</text><text x="0.0" y="382.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.7">（本文の表と同じ数値。合算は 文系と理系の合格者を足して280人で割ったもの。）</text></svg>