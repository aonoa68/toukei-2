<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 342" role="img" aria-labelledby="cht chd" style="width:100%;height:auto;max-width:720px;display:block;margin:0.8em auto" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="13"><title id="cht">2人の子ども問題 ―― 消えるのは1通りだけ</title><desc id="chd">男女が半々で独立に決まるとき、2人の組み合わせは（男,男）（男,女）（女,男）（女,女）の4通りが等確率である。「少なくとも1人は女」と分かると（男,男）の1通りだけが消え、残りは3通り。そのうち「2人とも女」は1通りなので、確率は4分の1から3分の1に更新される。2分の1にはならない。</desc><text x="0.0" y="28.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">「少なくとも1人は女」で消えるのは、4通りのうち1通りだけ</text><rect x="60.0" y="62.0" width="150.0" height="96.0" rx="5" ry="5" fill="#c62828" fill-opacity="0.18" stroke="#c62828" stroke-width="1" stroke-opacity="0.6"/><text x="135.0" y="98.0" font-size="12.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0">上の子 男</text><text x="135.0" y="122.0" font-size="12.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0">下の子 男</text><text x="135.0" y="146.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.6">各 1/4</text><line x1="70.0" y1="72.0" x2="200.0" y2="148.0" stroke="#c62828" stroke-width="2.4" stroke-opacity="0.8"/><line x1="200.0" y1="72.0" x2="70.0" y2="148.0" stroke="#c62828" stroke-width="2.4" stroke-opacity="0.8"/><text x="135.0" y="180.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#c62828" fill-opacity="1.0">消える</text><rect x="224.0" y="62.0" width="150.0" height="96.0" rx="5" ry="5" fill="#00897b" fill-opacity="0.1" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><text x="299.0" y="98.0" font-size="12.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0">上の子 男</text><text x="299.0" y="122.0" font-size="12.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0">下の子 女</text><text x="299.0" y="146.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.6">各 1/4</text><rect x="388.0" y="62.0" width="150.0" height="96.0" rx="5" ry="5" fill="#00897b" fill-opacity="0.1" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><text x="463.0" y="98.0" font-size="12.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0">上の子 女</text><text x="463.0" y="122.0" font-size="12.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0">下の子 男</text><text x="463.0" y="146.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.6">各 1/4</text><rect x="552.0" y="62.0" width="150.0" height="96.0" rx="5" ry="5" fill="#00897b" fill-opacity="0.1" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><text x="627.0" y="98.0" font-size="12.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0">上の子 女</text><text x="627.0" y="122.0" font-size="12.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0">下の子 女</text><text x="627.0" y="146.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.6">各 1/4</text><rect x="549.0" y="59.0" width="156.0" height="102.0" rx="7" ry="7" fill="none" fill-opacity="1.0" stroke="#ef6c00" stroke-width="2.4" stroke-opacity="0.9"/><text x="627.0" y="180.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#ef6c00" fill-opacity="1.0">これが「2人とも女」</text><line x1="217.0" y1="196.0" x2="702.0" y2="196.0" stroke="#00897b" stroke-width="2" stroke-opacity="0.6"/><text x="463.0" y="216.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#00897b" fill-opacity="1.0">残るのは 3通り（どれも同じ確からしさ）</text><text x="0.0" y="258.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.95">答えは 1/3。「もう1人が男か女か」と考えると 1/2 に見えるが、それは（女,男）と（男,女）を1つに数えてしまっている。</text><text x="0.0" y="282.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.95">情報を得る ＝ 舞台を絞り込む ＝ 確率を更新する。ここでは 1/4 → 1/3 に上がった。</text><text x="0.0" y="316.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.7">（男女が半々・独立という仮定のもとでの値。10万世帯のシミュレーションでも約 0.333 になる。）</text></svg>